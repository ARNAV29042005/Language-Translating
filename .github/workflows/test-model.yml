name: Test seq2seq model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Graphviz system package
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run model script
        run: python seq2seq_model.py
